
services:

  flask:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boutique-api
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - boutique-network
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: boutique-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - boutique-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: boutique-redis
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - boutique-network
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

networks:
  boutique-network:
    driver: bridge
